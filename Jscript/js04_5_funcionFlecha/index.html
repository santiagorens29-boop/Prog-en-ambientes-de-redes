<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <title>JS04_5 Función Flecha (Arrow Function)</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 30px;
        }

        h2 {
            font-size: 1.5em;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .bloqueFirma {
            font-family: Consolas, "Courier New", monospace;
            font-size: 1.15em;
            font-weight: bold;
            color: #0369a1;
            background-color: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 10px 16px;
            margin-bottom: 25px;
            width: fit-content;
            border-radius: 0 4px 4px 0;
        }

        .filaCalculo {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .campoNumero {
            width: 130px;
            padding: 6px 10px;
            font-size: 1em;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            outline: none;
            background-color: #ffffff;
        }

        .campoNumero:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }

        .campoResultado {
            background-color: #e2e8f0;
            font-weight: bold;
            color: #0f766e;
        }

        .btnSuma {
            padding: 7px 16px;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btnSuma:hover {
            background-color: #0369a1;
        }

        .contenedorNavegacion {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #cbd5e1;
        }

        .btnVolver {
            padding: 7px 14px;
            margin-right: 8px;
            background-color: #334155;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btnVolver:hover {
            background-color: #0f766e;
        }
    </style>
</head>
<body>

    <h2>Función Flecha</h2>

    <!-- Declaración visual de la firma en ES6 (apunte pág. 7) -->
    <div class="bloqueFirma">
        const suma = (a, b) => { c = a + b; return c; }
    </div>

    <!-- Contenedor con los dos inputs de entrada, botón y salida (apunte pág. 5 y 6) -->
    <div class="filaCalculo">
        <input type="text" id="a" class="campoNumero" placeholder="Operando A" value="3" />
        <input type="text" id="b" class="campoNumero" placeholder="Operando B" value="4" />
        <button id="btnEjecutar" class="btnSuma" type="button">suma</button>
        <input type="text" id="c" class="campoNumero campoResultado" readonly placeholder="Resultado" />
    </div>

    <!-- Script con la función flecha y el listener de evento (apunte pág. 5, 6 y 7) -->
    <script type="text/javascript">
        /* Declaración de función flecha con const según estándar ES6 (apunte pág. 7) */
        const suma = (a, b) => {
            let c = a + b;
            return c;
        };

        /* Manejador de evento click mediante addEventListener (apunte pág. 5) */
        document.getElementById("btnEjecutar").addEventListener("click", function() {
            var valA = parseInt(document.getElementById("a").value) || 0;
            var valB = parseInt(document.getElementById("b").value) || 0;

            /* Invocación de la función flecha y escritura sobre la propiedad value (apunte pág. 5 y 7) */
            var total = suma(valA, valB);
            document.getElementById("c").value = total;
        });
    </script>

    <!-- Barra de navegación inferior -->
    <div class="contenedorNavegacion">
        <button class="btnVolver" type="button" onclick="location.href='../index.html'">Volver a JavaScript</button>
        <button class="btnVolver" type="button" onclick="location.href='../../index.html'">Volver al Inicio</button>
    </div>

</body>
</html>
