<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <title>JS03_1 Variables Simples y Tipos de Datos</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 25px;
        }
        .panelBotones {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }
        .btnVar {
            padding: 6px 12px;
            background-color: #e2e8f0;
            color: #1e293b;
            border: 1px solid #94a3b8;
            border-radius: 3px;
            cursor: pointer;
            font-family: Consolas, monospace;
            font-size: 0.9em;
            font-weight: 600;
        }
        .btnVar:hover {
            background-color: #cbd5e1;
        }
        /* Contenedor visual del resultado */
        #resultado {
            width: 100%;
            height: 220px;
            background-color: #bae6fd; /* Azul cielo suave */
            border: 2px solid #0f172a;
            box-sizing: border-box;
            padding: 25px;
        }
        #resultado h2 {
            margin: 0 0 12px 0;
            font-size: 1.4em;
            font-weight: 700;
            color: #0f172a;
        }
        .contenedorNavegacion {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #cbd5e1;
        }
        .btnVolver {
            padding: 7px 14px;
            margin-right: 8px;
            background-color: #334155;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btnVolver:hover {
            background-color: #0f766e;
        }
    </style>
</head>
<body>

    <!-- Panel de Botones para evaluar variables y coerción (apunte pág. 4) -->
    <div class="panelBotones">
        <button class="btnVar" onclick="mostrarVariable('z', z)">var z;</button>
        <button class="btnVar" onclick="mostrarVariable('q', q)">let q;</button>
        <button class="btnVar" onclick="mostrarVariable('a', a)">var a = 1;</button>
        <button class="btnVar" onclick="mostrarVariable('b', b)">var b = '1';</button>
        <button class="btnVar" onclick="mostrarVariable('c', c)">var c = 2;</button>
        <button class="btnVar" onclick="mostrarVariable('suma1 (a + b)', a + b)">suma1 = a + b;</button>
        <button class="btnVar" onclick="mostrarVariable('suma2 (a + c)', a + c)">suma2 = a + c;</button>
    </div>

    <!-- Caja de visualización en el DOM -->
    <div id="resultado">
        <h2>Presione un botón para inspeccionar el valor y el tipo de dato.</h2>
    </div>

    <!-- Declaración de variables y función controladora (apunte pág. 2 y 4) -->
    <script type="text/javascript">
        /* Declaraciones globales para demostración (apunte pág. 2) */
        var z;
        let q;
        var a = 1;
        var b = "1";
        var c = 2;

        /* Función para inyectar datos en el contenedor con innerHTML y typeof (apunte pág. 4) */
        function mostrarVariable(nombre, valor) {
            var contenedor = document.getElementById("resultado");
            contenedor.innerHTML = "<h2>Valor de " + nombre + ": " + valor + "</h2>" +
                                   "<h2>Tipo de " + nombre + ": " + typeof valor + "</h2>";
        }
    </script>

    <!-- Barra de navegación inferior -->
    <div class="contenedorNavegacion">
        <button class="btnVolver" type="button" onclick="location.href='../index.html'">Volver a JavaScript</button>
        <button class="btnVolver" type="button" onclick="location.href='../../index.html'">Volver al Inicio</button>
    </div>

</body>
</html>
