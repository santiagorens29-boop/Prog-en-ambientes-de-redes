<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <title>JS04_1 Operaciones sobre Input del DOM</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding: 30px;
        }
        h2 {
            font-size: 1.25em;
            color: #0f172a;
            margin-bottom: 20px;
        }
        .filaOperaciones {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .campoEntrada {
            padding: 7px 12px;
            font-size: 1em;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            width: 140px;
            outline: none;
            background-color: #ffffff;
        }
        .campoEntrada:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }
        .btnOperacion {
            padding: 7px 14px;
            background-color: #e2e8f0;
            color: #0f172a;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }
        .btnOperacion:hover {
            background-color: #cbd5e1;
        }
        .contenedorNavegacion {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #cbd5e1;
        }
        .btnVolver {
            padding: 7px 14px;
            margin-right: 8px;
            background-color: #334155;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btnVolver:hover {
            background-color: #0f766e;
        }
    </style>
</head>
<body>

    <h2>Introducir un valor en el cuadro de texto y luego pulsar el botón para ejecutar el procedimiento correspondiente:</h2>

    <div class="filaOperaciones">
        <!-- Input identificado por id (apunte pág. 5) -->
        <input type="text" id="x" class="campoEntrada" placeholder="Ingrese número" />

        <!-- Botones de operaciones -->
        <button class="btnOperacion" type="button" onclick="mostrarValor()">Muestra valor</button>
        <button class="btnOperacion" type="button" onclick="sumarUno()">Suma 1</button>
        <button class="btnOperacion" type="button" onclick="elevarAlCuadrado()">x**2</button>
        <button class="btnOperacion" type="button" onclick="multiplicarPorDos()">Multiplica * 2</button>
        <button class="btnOperacion" type="button" onclick="potenciaDeDos()">2**x</button>
    </div>

    <!-- Script con manipulación directa de la propiedad .value (apunte pág. 5 y 6) -->
    <script type="text/javascript">
        /* 1. Muestra el valor en el cartel modal alert() */
        function mostrarValor() {
            var valor = document.getElementById("x").value;
            alert(valor);
        }

        /* 2. Suma 1 y sobreescribe directamente en el input */
        function sumarUno() {
            var inputElemento = document.getElementById("x");
            var valorNumerico = parseInt(inputElemento.value);

            if (isNaN(valorNumerico)) {
                alert("Por favor ingrese un valor numérico válido.");
                return;
            }
            inputElemento.value = valorNumerico + 1;
        }

        /* 3. Calcula x**2 y lo asigna al input */
        function elevarAlCuadrado() {
            var inputElemento = document.getElementById("x");
            var valorNumerico = parseInt(inputElemento.value);

            if (isNaN(valorNumerico)) {
                alert("Por favor ingrese un valor numérico válido.");
                return;
            }
            inputElemento.value = valorNumerico ** 2;
        }

        /* 4. Multiplica por 2 y lo asigna al input */
        function multiplicarPorDos() {
            var inputElemento = document.getElementById("x");
            var valorNumerico = parseInt(inputElemento.value);

            if (isNaN(valorNumerico)) {
                alert("Por favor ingrese un valor numérico válido.");
                return;
            }
            inputElemento.value = valorNumerico * 2;
        }

        /* 5. Calcula 2**x y lo asigna al input */
        function potenciaDeDos() {
            var inputElemento = document.getElementById("x");
            var valorNumerico = parseInt(inputElemento.value);

            if (isNaN(valorNumerico)) {
                alert("Por favor ingrese un valor numérico válido.");
                return;
            }
            inputElemento.value = 2 ** valorNumerico;
        }
    </script>

    <!-- Barra de navegación inferior -->
    <div class="contenedorNavegacion">
        <button class="btnVolver" type="button" onclick="location.href='../index.html'">Volver a JavaScript</button>
        <button class="btnVolver" type="button" onclick="location.href='../../index.html'">Volver al Inicio</button>
    </div>

</body>
</html>
